name: Native cryptography build prerequisites
description: Select complete native Perl for vendored OpenSSL on Windows.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # The same build actions-setup-perl 3b59bd33 installs for Perl 5.40
        # on Windows. GitHub's release host answers 504 often enough that
        # that action's two short retries fail the job before any test runs.
        # This downloads that archive, retrying, then checks the same modules.
        $url = 'https://github.com/shogo82148/build-perl/releases/download/perl-5.40.5-20260803012115/perl-5.40.5-thr-win32-x64.zip'
        $root = Join-Path $env:RUNNER_TEMP 'perl-5.40.5'
        $zip = Join-Path $env:RUNNER_TEMP 'perl-5.40.5.zip'
        if (Test-Path $root) { Remove-Item $root -Recurse -Force }
        & curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o $zip $url
        if ($LASTEXITCODE -ne 0) { throw "Perl download failed: curl exit $LASTEXITCODE" }
        Expand-Archive -Path $zip -DestinationPath $root
        $perl = Join-Path $root 'bin\perl.exe'
        if (-not (Test-Path $perl)) { throw 'Incomplete Perl archive: perl.exe is missing' }
        & $perl -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "Complete Perl verified`n"'
        if ($LASTEXITCODE -ne 0) { throw 'Incomplete Perl cannot build vendored OpenSSL' }
        (Split-Path $perl) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
