name: Canonical browser verification

# Manual only. This file must first exist on the default branch for dispatch.
# Source/base are commits on this repository's branches, never arbitrary URLs.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full lowercase source commit SHA from this repository
        required: true
        type: string
      base:
        description: Full lowercase comparison-base commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  browsers:
    strategy:
      fail-fast: false
      matrix:
        comparison: [candidate, base]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # Planning bound, not a measured browser CI duration. Cold gateway builds,
    # dependency downloads and both engines must fit; a timeout remains failure.
    timeout-minutes: 60
    env:
      BROWSER_EVIDENCE: ${{ github.workspace }}-browser-evidence
      MATCHED_CASE: ${{ matrix.comparison }}
      COMPARISON_CANDIDATE: ${{ inputs.source }}
      COMPARISON_BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Keep the reviewed publisher outside the source checkout, which may be
      # the final product tree with all diagnostic scaffolding removed.
      - name: Retain the reviewed diagnostic publisher
        run: |
          cp scripts/desktop/fresh-native-diagnostic.py "$RUNNER_TEMP/nessa-fresh-diagnostic.py"
          cp scripts/desktop/matched-request-observer.mjs "$RUNNER_TEMP/nessa-matched-observer.mjs"
          cp scripts/desktop/matched-gateway-result.py "$RUNNER_TEMP/nessa-matched-result.py"
      - name: Validate commits and prepare the exact tree
        env:
          SOURCE_SHA: ${{ matrix.comparison == 'candidate' && inputs.source || inputs.base }}
          BASE_SHA: ""
        run: |
          mkdir -p "$BROWSER_EVIDENCE"
          node scripts/prepare-browser-verification.mjs 2>&1 | tee "$BROWSER_EVIDENCE/prepare.log"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-auth
          save-if: false
      - uses: ./.github/actions/pnpm-install
      - name: Install the pinned Playwright browsers and official runtime dependencies
        run: pnpm exec playwright install --with-deps chromium webkit 2>&1 | tee "$BROWSER_EVIDENCE/browser-install.log"
        timeout-minutes: 15
      - name: Run the canonical signed-out suite in both engines
        run: |
          set +e
          export MATCHED_REQUEST_OUTPUT="$BROWSER_EVIDENCE/matched-requests.json"
          export NODE_OPTIONS="--import=\"$RUNNER_TEMP/nessa-matched-observer.mjs\""
          pnpm test:e2e:scripted -- --channel bundled --evidence "$BROWSER_EVIDENCE" 2>&1 | tee "$BROWSER_EVIDENCE/canonical.log"
          canonical_status=$?
          FRESH_COMMAND_STATUS="$canonical_status" python3 "$RUNNER_TEMP/nessa-fresh-diagnostic.py" "$BROWSER_EVIDENCE/canonical.log" --browser-evidence "$BROWSER_EVIDENCE"
          summary_status=$?
          python3 "$RUNNER_TEMP/nessa-matched-result.py" "$BROWSER_EVIDENCE"
          diagnostic_status=$?
          if [ "$canonical_status" -eq 0 ] && [ "$summary_status" -ne 0 ]; then exit "$summary_status"; fi
          if [ "$canonical_status" -eq 0 ]; then exit "$diagnostic_status"; fi
          exit "$canonical_status"
        timeout-minutes: 35
      - name: Preserve provenance and complete browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-browser-${{ matrix.comparison }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BROWSER_EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
