name: Local authentication platforms
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rust-cache:
        description: Restore the shared Rust build cache, or compile cold for a measurement.
        type: choice
        options:
          - restore
          - cold
        default: restore
      desktop-performance:
        description: Measure the desktop frame budget on the existing standard Mac runner.
        type: boolean
        default: false

# Nothing here writes anything. Said out loud because the default for a token is
# whatever the repository's default happens to be, and `changes` below reaches
# for the API rather than the working tree — the one job that asks GitHub for
# anything at all.
permissions:
  contents: read

# A pull request that is pushed to again does not need the run it just
# superseded: six runs of this workflow for one branch is six times four
# runners, and only the last of them gates anything. Pushes to `main` are left
# to finish — they are what populates the build caches every later run reads,
# and a cancelled one leaves the next pull request paying for a cold compile.
#
# Each push to `main` has a group of its own, named by its commit. Under one
# group for the branch they ran one at a time: a push waited for the run
# before it (runs 43655622363 and 43659129964 each took about 80 minutes, half
# of it waiting), and a push that arrived while another was already waiting
# replaced it, so that commit never ran (run 43643818697).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A workflow that will not start reports a failure with no jobs in it: nothing
  # to open, no log, no annotation. That is how a `secrets` reference in a step's
  # `if` sat in the release workflow unnoticed — the only runs it could have
  # broken were tag pushes, and the branch pushes that did fail looked like
  # noise. This is the gate that reads the files before GitHub has to.
  #
  # Pinned, and installed from the release archive rather than an action, so the
  # version doing the checking is the version named here.
  #
  # The version matters beyond reproducibility: actionlint carries its own list
  # of GitHub-hosted runner labels, and 1.7.7 does not know macos-15-intel,
  # which the release workflow builds on. A pin too old rejects a runner that
  # exists, so this moves when a workflow names a newer one.
  workflows:
    name: Workflow files are valid
    runs-on: ubuntu-latest
    # Twenty-one green runs on 2026-10-07 finished this job in at most 0.2
    # minutes. Ten minutes bounds a hung actionlint download.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        env:
          VERSION: 1.7.12
        run: |
          set -euo pipefail
          # GitHub's release host answers 504 often enough that one attempt
          # fails the job before actionlint runs. Retry the download; the
          # check itself is unchanged.
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          archive="$(mktemp)"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o "$archive" "$url"
          tar -xz -C /usr/local/bin -f "$archive" actionlint
          rm -f "$archive"
      - run: actionlint

  # Everything below this is `rustc`, and a change that edits prose cannot make
  # any of it fail. This job is what lets such a change say so, and, for a
  # change that is code, which Rust work it can reach.
  #
  # It sits in front of every other job, so its own cost is the thing to watch.
  # It never checks out a working tree: the file list and diffs come from the
  # API, and the checkout is the two rule scripts plus the workspace's
  # `Cargo.toml` files and Rust sources, with no other blobs.
  #
  # The rules are `scripts/documentation-only.mjs` (whether anything compiles)
  # and `scripts/ci-plan.mjs` (which crates the Rust steps test, whether the SDK
  # coverage job runs, and whether macOS and Windows run their test suites or
  # only clippy). Each is tested beside it, and that is where the reasoning
  # lives. Only pull requests are ever narrowed. A push to `main` runs in full
  # whatever it touched: it is the run whose caches every later run reads, and
  # the run that catches a platform break a narrowed pull request let through.
  #
  # Every job and step that waits on this one asks `!= 'false'` rather than
  # `== 'true'`, and the difference is the whole safety of the thing. A required
  # check that is skipped counts as a required check that passed, so if this job
  # could fail and take the others down as skipped, one bad API call would be
  # indistinguishable from a green pull request. Written this way, only an
  # explicit `false` from a job that ran to completion skips anything; a
  # failure, an empty output or an error leaves the outputs unset and everything
  # runs, with this job red beside it. An empty `rust_packages` runs every
  # crate's tests.
  changes:
    name: What this change needs
    runs-on: ubuntu-latest
    # At most 0.2 minutes across those same runs. Ten minutes bounds the
    # file-list API call, which is the only thing here that can stall.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      rust: ${{ steps.decide.outputs.rust }}
      rust_packages: ${{ steps.decide.outputs.rust_packages }}
      sdk: ${{ steps.decide.outputs.sdk }}
      platform_tests: ${{ steps.decide.outputs.platform_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/documentation-only.mjs
            /scripts/ci-plan.mjs
            /Cargo.toml
            /crates/**/Cargo.toml
            /crates/**/*.rs
            /src-tauri/Cargo.toml
            /src-tauri/**/*.rs
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "$EVENT runs everything."
            : | node scripts/ci-plan.mjs --github-output
            exit 0
          fi
          # `--paginate` because the default page is thirty files and a
          # truncated list is a list that looks like documentation. One JSON
          # object per file keeps each diff with its name.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files" \
            --jq '.[] | {filename, previous_filename, patch} | @json' > changed.jsonl
          node scripts/ci-plan.mjs --files-jsonl --github-output < changed.jsonl

  gateway-contract:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Warm runs in that sample finished in at most 1.6 minutes. Before the
    # cache, this job compiled the workspace dependency graph and was most of
    # a thirty-minute run, so forty-five minutes covers a cold graph.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Every job in this workflow compiled the same 600-crate dependency graph
      # from nothing on every push, which was most of a thirty-minute run. The
      # cache is only written from `main`, so a pull request reads the tip's
      # artifacts and never evicts them: one entry per job, not one per branch,
      # which is what keeps the repository under its ten-gigabyte ceiling.
      #
      # Nothing about what gets checked changes. Cargo decides what to rebuild
      # from its own fingerprints; this only supplies artifacts it would
      # otherwise regenerate, and `Cargo.lock` is part of the key.
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check portable Rust dependency graphs
        run: node scripts/check-runtime-dependencies.mjs --verify-fixture
      - run: node --test scripts/cargo-test-parallel/e2e.test.mjs scripts/cargo-test-parallel/diagnostics.test.mjs
      - run: cargo fmt --all -- --check
      # This pure shared domain is small enough to report denied warnings
      # before its tests without paying a second workspace compile.
      - run: cargo clippy -p nessa-agent-credentials --all-targets -- -D warnings
      - run: cargo test -p nessa-agent-credentials
      - run: cargo clippy --locked -p nessa-app-package --all-features --all-targets -- -D warnings
      - run: cargo test --locked -p nessa-app-package --all-features
      # Test before lint, here and in the matrix below, and it is worth saying
      # why because the intuitive order is the other one. Reporting a
      # `-D warnings` failure first would be better if it were free, and it is
      # not: `cargo test` builds rlibs that a following `cargo clippy` reuses,
      # so lint lands in about five seconds. Reversed, clippy builds metadata
      # that `cargo test` cannot link against, and both compilations are paid
      # in full. Measured on run 35678361232: +39s here, and minutes on each
      # matrix leg. Green runs are the common case, so they set the order.
      - run: cargo test -p nessa-mcp
      - run: cargo clippy -p nessa-mcp --all-targets -- -D warnings
      - run: cargo test -p nessa-images
      - run: cargo clippy -p nessa-images --all-targets -- -D warnings
      - run: node scripts/check-architecture.mjs
      # The official client and protocol checks do not require the desktop UI's
      # separate repository. Install only their tooling in an isolated harness.
      - name: Prepare gateway contract harness
        shell: python
        run: |
          import json, pathlib, shutil
          root = pathlib.Path('.ci-gateway')
          root.mkdir()
          shutil.copytree('packages/nessa-client', root / 'packages/nessa-client')
          shutil.copytree('protocol', root / 'protocol')
          shutil.copytree('scripts', root / 'scripts')
          shutil.copytree('crates/nessa-protocol/src/protocol', root / 'crates/nessa-protocol/src/protocol')
          # Generation/parity fixtures consume these canonical source inputs directly.
          for name in [
              'Cargo.lock',
              'crates/nessa-auth/src/domain/pairing/value_objects/wire-values.json',
              'crates/nessa-auth/src/domain/pairing/value_objects/wire_values.rs',
              'crates/nessa-sdk/src/infrastructure/session_storage/stream_fact.rs',
              'crates/nessa-sdk/src/infrastructure/session_storage/record_source.rs',
              'crates/nessa-sdk/src/infrastructure/acp/sessions/config.rs',
              'crates/nessa-sdk/src/infrastructure/mcp/servers.rs',
              'crates/nessa-conversation/src/domain/value_objects/channel.rs',
              'crates/nessa-conversation/src/domain/value_objects/vm_lifetime.rs',
              'crates/nessa-sdk/src/domain/agent_execution/permissions/value_objects/review_limits.rs',
              'crates/nessa-sdk/src/domain/agent_execution/questions/value_objects/question.rs',
              'crates/nessa-protocol/src/product_contract/generated.rs',
              'src-tauri/src/vault/application/contract.rs',
          ]:
              destination = root / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(name, destination)
          product = root / 'crates/nessa-protocol/src/product'
          product.mkdir(parents=True)
          shutil.copy2('crates/nessa-protocol/src/product/generated.rs', product / 'generated.rs')
          shutil.copy2('vitest.config.ts', root / 'vitest.config.ts')
          # The config's setup file: every run loads it, this harness's included.
          (root / 'src/test').mkdir(parents=True)
          shutil.copy2('src/test/match-media.ts', root / 'src/test/match-media.ts')
          shutil.copy2('prettier.config.js', root / 'prettier.config.js')
          shutil.copy2('.prettierignore', root / '.prettierignore')
          package = json.loads(pathlib.Path('package.json').read_text())
          dependencies = {
              name: package['devDependencies'][name].lstrip('^~')
              for name in ['@types/node', '@types/ws', 'ajv', 'ajv-formats', 'json-schema-to-typescript', 'prettier', 'typescript', 'vitest', 'ws']
          }
          (root / 'package.json').write_text(json.dumps({'private': True, 'type': 'module', 'devDependencies': dependencies}))
      - run: npm install --ignore-scripts
        working-directory: .ci-gateway
      - run: npm exec -- prettier --check packages/nessa-client scripts prettier.config.js
        working-directory: .ci-gateway
      - run: npm exec -- vitest run --config vitest.config.ts packages/nessa-client
        working-directory: .ci-gateway
      - run: npm exec -- tsc --noEmit -p packages/nessa-client/tsconfig.json
        working-directory: .ci-gateway
      - run: node scripts/check-protocol.mjs
        working-directory: .ci-gateway
      - run: node scripts/check-product-protocol.mjs
        working-directory: .ci-gateway
  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # `pnpm frontend:check` finished in at most 5.8 minutes in that sample.
    # Thirty minutes covers a cold install in front of it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-install
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      # `frontend:check` owns the repository's top-level script tests, including
      # `scripts/mcp-test-server` through `pnpm scripts:test` (#476). They are
      # not run again from another job. Two of the script tests execute the
      # public launch recipes, so install their real command boundary here
      # before the aggregate runs.
      - uses: taiki-e/install-action@just
      - run: pnpm frontend:check
  # The conversation stress check (verification/desktop/scripts/conversation-stress.mjs):
  # one conversation talked to for many rounds through the real gateway and
  # the desktop window, with the scripted agent as the model, while other
  # conversations run beside it. Every feature a person reaches through a
  # conversation is flexed here (CODING_STANDARDS.md, "Conversation stress").
  # The pull request runs its default numbers; the nightly load run in
  # conversation-stress-load.yml raises them.
  #
  # The scripted, browser, focused WebKit and chaos checks run beside it in
  # `conversation-checks`, on a runner of their own. In one job they ran
  # after the stress check, one after the other: 26 to 35 minutes per pull
  # request, longer than any test leg once those got faster. Each job builds
  # the same gateway and installs the same browsers, so what is checked does
  # not change, only how many of the checks wait for each other.
  conversation-stress:
    name: Conversation stress check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Planning bound: a cold gateway build, the browser install, the stress
    # check, and the chaos check's seeds (with a shrink if one fails).
    # Run 42072698358 finished in 33 minutes, 38 seconds of that in the
    # browser install and about 31 minutes after it. Run 42079903038 was
    # still fetching apt packages when the install step's 30 minute bound
    # fired. The install step now allows the 45 minutes a moving apt install
    # is given in scripts/desktop/install-linux-build-deps.sh. 45 + 31 is 76,
    # so this job is 90.
    timeout-minutes: 90
    env:
      STRESS_EVIDENCE: ${{ github.workspace }}-stress-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-install
      - name: Install the pinned browsers and their runtime dependencies
        run: |
          set -euo pipefail
          # A dropped Azure mirror connection used to hold apt until this
          # step's own bound (run 42079903038). The retries and the socket
          # timeout are the ones install-linux-build-deps.sh already uses.
          sudo tee /etc/apt/apt.conf.d/99-nessa-ci-retries >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          pnpm exec playwright install --with-deps chromium webkit
        # 45 minutes is that script's ceiling for an install that is still
        # moving. Run 42079903038 had not finished fetching at 30.
        timeout-minutes: 45
      - name: Verify row action hover ownership in pinned Chromium
        run: NESSA_HOVER_BROWSER=bundled node --test verification/desktop/scripts/lib/hover-state.test.mjs
      # nessa-mcp: the stress check's `github` step runs commands through
      # Nessa's own shell tool.
      # Terminals need the pinned libghostty-vt (scripts/terminal/ghostty.sh),
      # kept between runs by the pty-runtime rev it is built for.
      - uses: actions/cache@v4
        with:
          path: .vendor/pty-runtime
          key: ghostty-${{ runner.os }}-${{ hashFiles('crates/nessa-gateway/Cargo.toml', 'scripts/terminal/ghostty.sh') }}
      - id: gateway-build
        run: |
          eval "$(scripts/terminal/ghostty.sh)"
          cargo build -p nessa-server --features nessa-server/terminals -p nessa-mcp
          # Later steps build gateways too (the stress check's VM fixture).
          echo "PTY_RUNTIME_GHOSTTY_SOURCE=$PTY_RUNTIME_GHOSTTY_SOURCE" >> "$GITHUB_ENV"
      # The peer step enrolls through this example. It is not the gateway
      # build chaos waits on.
      - name: Build the peer example
        run: cargo build -p nessa-client-core --example read_only_sync
      # The private Swift phone product is exercised by nessa-ios's macOS
      # phone-files-stress workflow against this exact gateway source.
      # This Ubuntu job cannot build that product; it retains core window load.
      - name: Run the conversation stress check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$STRESS_EVIDENCE"
          pnpm test:e2e:stress -- --inputFiles 0 --channel bundled --evidence "$STRESS_EVIDENCE" --out "$STRESS_EVIDENCE/result.json" 2>&1 | tee "$STRESS_EVIDENCE/stress.log"
        # The run builds its VM fixture gateway first (about 4 minutes, with
        # terminals), then 87 steps in about 16; 20 cut a run that held them all.
        timeout-minutes: 30
      - name: Keep the evidence of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STRESS_EVIDENCE }}
          if-no-files-found: ignore
          retention-days: 7

  # The checks that used to run after the stress check in its job: the
  # scripted gateway checks, the browser checks, the focused WebKit stress
  # steps and the conversation chaos check. Same gateway build, same browsers.
  conversation-checks:
    name: Conversation scripted, WebKit and chaos checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # The browser install may use 45 minutes (run 42079903038 was still
    # fetching at 30); everything after it took at most 16 minutes in the
    # combined job, plus a cold gateway build. 90, as the stress job.
    timeout-minutes: 90
    env:
      STRESS_EVIDENCE: ${{ github.workspace }}-stress-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          # The same gateway build as `conversation-stress`, which stays the
          # one writer of this cache: two writers would double what it keeps
          # against the repository's ten-gigabyte ceiling.
          shared-key: conversation-stress
          save-if: false
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-install
      - name: Install the pinned browsers and their runtime dependencies
        run: |
          set -euo pipefail
          # A dropped Azure mirror connection used to hold apt until this
          # step's own bound (run 42079903038). The retries and the socket
          # timeout are the ones install-linux-build-deps.sh already uses.
          sudo tee /etc/apt/apt.conf.d/99-nessa-ci-retries >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          pnpm exec playwright install --with-deps chromium webkit
        # 45 minutes is that script's ceiling for an install that is still
        # moving. Run 42079903038 had not finished fetching at 30.
        timeout-minutes: 45
      # nessa-mcp: the stress check's `github` step runs commands through
      # Nessa's own shell tool.
      # Terminals need the pinned libghostty-vt (scripts/terminal/ghostty.sh),
      # kept between runs by the pty-runtime rev it is built for.
      - uses: actions/cache@v4
        with:
          path: .vendor/pty-runtime
          key: ghostty-${{ runner.os }}-${{ hashFiles('crates/nessa-gateway/Cargo.toml', 'scripts/terminal/ghostty.sh') }}
      - id: gateway-build
        run: |
          eval "$(scripts/terminal/ghostty.sh)"
          cargo build -p nessa-server --features nessa-server/terminals -p nessa-mcp
          # Later steps build gateways too (the stress check's VM fixture).
          echo "PTY_RUNTIME_GHOSTTY_SOURCE=$PTY_RUNTIME_GHOSTTY_SOURCE" >> "$GITHUB_ENV"
      # The peer step enrolls through this example. It is not the gateway
      # build chaos waits on.
      - name: Build the peer example
        run: cargo build -p nessa-client-core --example read_only_sync
      # The reset-boundary regression needs both engines, including WebKit's
      # ticking-clock path.
      - name: Run the scripted gateway checks in both browsers
        run: pnpm test:e2e:scripted -- --channel bundled --evidence "$STRESS_EVIDENCE/scripted"
      - name: Verify GitHub live-event opt-in in both browsers
        run: node verification/desktop/scripts/github-live-events.mjs --channel bundled --out "$STRESS_EVIDENCE/github-live-events.json" --shots "$STRESS_EVIDENCE/github-live-events"
      - name: Verify usage-limit cards in both browsers
        run: node verification/desktop/scripts/usage-limit.mjs --channel bundled --out "$STRESS_EVIDENCE/usage-limit.json" --shots "$STRESS_EVIDENCE/usage-limit"
      - name: Verify pane dragging after deferred fitting in both browsers
        run: node verification/desktop/scripts/drag.mjs --engine chromium,webkit --layout columns --channel bundled --only resize-mid-drag,return-interrupted --out "$STRESS_EVIDENCE/drag.json"
      # Focused webhook coverage supplements the complete default run in
      # `conversation-stress`. Other knobs are zero so the
      # fixture never enables native discovery. These are not full-cohort runs.
      - name: Run focused webhook default and raised browser cases
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'webhooks') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled --seed 1 "${zero[@]}" --webhooks 1 --evidence "$STRESS_EVIDENCE/webhook-webkit-default" 2>&1 | tee "$STRESS_EVIDENCE/webhook-webkit-default.log"
          node verification/desktop/scripts/conversation-stress.mjs --engine chromium,webkit --channel bundled --seed 1 "${zero[@]}" --webhooks 3 --evidence "$STRESS_EVIDENCE/webhook-raised-both" 2>&1 | tee "$STRESS_EVIDENCE/webhook-raised-both.log"
        timeout-minutes: 10
      # The menu-bar panel ships in WKWebView, so its step also runs alone in
      # WebKit: page dots, the sent bubble's accent and rim, and the undo card.
      - name: Run the menu-bar panel stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'menuPanels') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --menuPanels 1 --evidence "$STRESS_EVIDENCE/menu-panel-webkit" 2>&1 | tee "$STRESS_EVIDENCE/menu-panel-webkit.log"
        timeout-minutes: 10
      # The window's menus ship in WKWebView too: row height, icons, the
      # check before its number, and picking a filter choice by its number.
      - name: Run the menu stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'menus') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --menus 1 --evidence "$STRESS_EVIDENCE/menu-webkit" 2>&1 | tee "$STRESS_EVIDENCE/menu-webkit.log"
        timeout-minutes: 10
      # The side rail ships in WKWebView too: the chat's title in the pane's
      # bar stays between where it stood and where it lands, every frame, as
      # the rail toggles, and stands still with the panes alone.
      - name: Run the rail stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'rails') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --rails 1 --evidence "$STRESS_EVIDENCE/rail-webkit" 2>&1 | tee "$STRESS_EVIDENCE/rail-webkit.log"
        timeout-minutes: 10
      # The model picker ships in WKWebView too: a star, a sideways swipe
      # over a row that steps its thinking level, and a press of a bar.
      - name: Run the model picker stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'pickers') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --pickers 1 --evidence "$STRESS_EVIDENCE/picker-webkit" 2>&1 | tee "$STRESS_EVIDENCE/picker-webkit.log"
        timeout-minutes: 10
      # The composer's row and a call's rim ship in WKWebView too: the short
      # model name, the row's order, and the rim on the composer's edge (the
      # drawn glow where the engine has WebGL, a still ring where it has not),
      # with the call pill carried between two pages.
      - name: Run the composer and voice stress steps in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'composers' && k !== 'voices') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --composers 1 --voices 1 --evidence "$STRESS_EVIDENCE/composer-voice-webkit" 2>&1 | tee "$STRESS_EVIDENCE/composer-voice-webkit.log"
        timeout-minutes: 10
      # Settings' GitHub row runs in WebKit too: its actions show under the
      # pointer or focus, take no pointer while hidden, and Tab between them.
      - name: Run the GitHub stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'githubs') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --githubs 1 --evidence "$STRESS_EVIDENCE/github-webkit" 2>&1 | tee "$STRESS_EVIDENCE/github-webkit.log"
        timeout-minutes: 10
      # Channel settings in WebKit too: Auto-stop's amount field saves on ↩ and
      # as it loses focus to its unit's menu, then the unit applies to it.
      - name: Run the channel stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'channels') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --channels 1 --evidence "$STRESS_EVIDENCE/channel-webkit" 2>&1 | tee "$STRESS_EVIDENCE/channel-webkit.log"
        timeout-minutes: 10
      # First-run setup ships in WKWebView too: the welcome is whole as it
      # opens, and a summon sends nothing through the light behind it.
      - name: Run the onboarding stress step in WebKit
        shell: bash
        run: |
          set -o pipefail
          mapfile -t zero < <(node --input-type=module -e "import { KNOBS } from './verification/desktop/scripts/lib/stress-plan.mjs'; for (const k of Object.keys(KNOBS)) if (k !== 'seed' && k !== 'onboardings') console.log('--' + k + '\n0')")
          node verification/desktop/scripts/conversation-stress.mjs --engine webkit --channel bundled "${zero[@]}" --onboardings 1 --evidence "$STRESS_EVIDENCE/onboarding-webkit" 2>&1 | tee "$STRESS_EVIDENCE/onboarding-webkit.log"
        timeout-minutes: 10
      # Seeded random actions from several clients at once on the same
      # gateway build (conversation-chaos.mjs): a few short seeds here, many
      # long ones nightly. A failure prints its seed and a shrunk action list.
      - name: Run the conversation chaos check
        if: ${{ !cancelled() && steps.gateway-build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$STRESS_EVIDENCE/chaos"
          pnpm test:e2e:chaos -- --evidence "$STRESS_EVIDENCE/chaos" 2>&1 | tee "$STRESS_EVIDENCE/chaos/chaos.log"
        timeout-minutes: 20
      - name: Keep the evidence of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.STRESS_EVIDENCE }}
          if-no-files-found: ignore
          retention-days: 7
  # The long Windows server selections start immediately on separate runners.
  # Every job compiles the complete package group to preserve Cargo feature
  # unification. Only execution is partitioned; remaining owns all doctests.
  windows-server-tests:
    name: Windows server library tests (${{ matrix.partition }})
    needs: changes
    # Skipped only when the plan says no platform code changed
    # (`scripts/ci-plan.mjs`). Every crate in the list leads to nessa-server,
    # so a change with platform code always reaches these tests. The macOS and
    # Windows legs of `local-auth` still run clippy on every Rust change.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.platform_tests != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        partition: [server-conversation, server-other]
    runs-on: windows-latest
    # The test step's 90 plus at most 4 minutes of setup.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-crypto
        if: runner.os == 'Windows'
      # Windows runs these tests many times slower than Linux (run 43811777001:
      # the conversation library took 1,296 s here and 131 s on Ubuntu), and
      # the slowest cases are the ones that save files. The default temp
      # directory is on the system drive; the workspace drive is the runner's
      # faster disk. This is a measurement first: the comparison is in the
      # pull request that added it.
      - name: Keep Windows test files on the workspace drive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nessa-tests"
          directory="$(cygpath -w "$RUNNER_TEMP/nessa-tests")"
          echo "TEMP=$directory" >> "$GITHUB_ENV"
          echo "TMP=$directory" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          # Restore the existing Windows matrix cache. It remains the sole
          # writer, including on main, so two jobs never race the same key.
          shared-key: local-auth
          save-if: false
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - shell: bash
        env:
          # Two harnesses may run at once; bound their independent libtest
          # workers too. Test-owned concurrency and deadlines stay unchanged.
          RUST_TEST_THREADS: "2"
        # Default libtest capture keeps failed-test assertions in the final
        # failure section, where the bounded diagnostic tail can retain them.
        # A later hang can delay those details; long-running notices and the
        # existing deadline still name and bound the stalled test.
        # The step compiles before it tests. Cargo.lock is part of the cache
        # key, so a change that edits it compiles the graph cold: about 25
        # minutes on this runner. Run 41947356093 was still inside
        # server-other's 2349 tests when a 70-minute deadline fired, with
        # 2283 passed. 90 covers that cold path. A warm run ends in under 35.
        run: node scripts/cargo-test-parallel.mjs --concurrency 2 --partition ${{ matrix.partition }} -- -p nessa-local-storage -p nessa-auth -p nessa-server -p nessa-conversation -p nessa-gateway -p nessa-protocol -p nessa-projection -p nessa-types -p nessa-client-core -p nessa-device-client -p nessa-sdk -p nessa-timer -p nessa-vault -p nessa-agent-install -p nessa-attachments -p nessa-peer-gateways -p nessa-mcp-authorization -p nessa-webhooks -p nessa-device-pairing -p nessa-backup -p nessa-telemetry
        timeout-minutes: 90

  # The Linux desktop host, on a runner of its own: its build packages, its
  # tests, the systemd and linger proofs, the shipping-profile runtime assembly
  # and the native window smoke. These ran at the end of the Ubuntu leg of
  # `local-auth`, after its Rust tests: 12 to 17 minutes in a row behind 15
  # (run 43811777001), on every pull request, including one that changed no
  # Rust (run 43881521635, where they were 16 of that leg's 21 minutes).
  # Nothing here reads what the Rust test step builds, so it starts at once.
  #
  # It runs on the shipping Linux baseline. A newer ubuntu-latest image can
  # change WebKitGTK/WebDriver packages and ABI underneath the release
  # contract (ci-harness.test.mjs, issue #1167).
  linux-desktop:
    name: Linux desktop host and native window
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-22.04
    # The apt step can run 65 minutes. Every other step together took at most
    # 17 minutes warm (run 43811777001), and the runtime assembly compiles the
    # gateway under the shipping profile when the cache is cold. 120 lets the
    # apt bound fire before the job does, as the release build's 120 does.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          # Rust's host triple does not distinguish Ubuntu's glibc baseline.
          key: ubuntu-22.04
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The desktop host's tests are not macOS-only, and one of them asserted
      # the opposite of what it said on Linux for want of ever running there:
      # `Path` treats a backslash as an ordinary character, so a Windows-shaped
      # fixture had no `target` component in it at all. check-desktop.mjs skips
      # when WebKitGTK is absent, so without this the skip stays permanent.
      - name: Install the desktop host's Linux build dependencies
        # The WebDriver and virtual display are this job's own, for the native
        # window smoke below.
        #
        # A silent stall on `apt-get update` held this step for 315 minutes and
        # for 79 minutes (runs 37668027204 and 37670890766, #653). The script's
        # worst case is 62.75 minutes: three updates of five minutes, a 30s
        # kill-after on each of those and on install, the 15s and 30s backoff
        # sleeps, and a 45 minute install. Sixty-five minutes is that budget
        # plus a small margin, so a mirror that never answers fails here with
        # the script's own message. Installs that were still moving, including
        # the 30.6 and 41.5 minute green ones, finish inside the 45 minute
        # install ceiling.
        run: bash scripts/desktop/install-linux-build-deps.sh webkit2gtk-driver xvfb
        timeout-minutes: 65
      - run: node scripts/check-desktop.mjs
      - name: Exercise the disposable systemd user-manager lifecycle
        run: bash scripts/desktop/check-systemd-user-service.sh
      # Same runner as the step above, which already built the nessa-app tests.
      # A throwaway user, never the runner account. Stock set-self-linger does
      # not prompt; the test failing to return would be that prompt.
      - name: Prove linger for a throwaway Linux user
        timeout-minutes: 15
        run: bash scripts/desktop/check-linux-linger.sh
      # This repeats a release build of nessa-server after the matrix's debug
      # build in `local-auth`, and a release build of nessa-mcp after
      # gateway-contract.
      # It is intentionally unique: this is the shipping-profile evidence that
      # the Linux assembler produces the complete fingerprinted resource tree.
      # No other job assembles Linux or consumes this generated directory.
      - name: Assemble the Linux desktop runtime
        run: node scripts/desktop/prepare.mjs
      # This is the one platform where Tauri has a native WebDriver for the
      # WebKit host. It drives the real embedded executable through a message
      # and attachment, then proves the app, provider, gateway, and drivers are
      # gone. macOS still gets the release-profile compile in `local-auth`;
      # WKWebView has no corresponding WebDriver endpoint.
      - name: Install native desktop WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked
      # The frontend job is the Ubuntu writer for this store key. A second save
      # from this step races it on the same run.
      - name: Install native desktop smoke dependencies
        uses: ./.github/actions/pnpm-install
      - name: Exercise the native desktop window
        env:
          NESSA_NATIVE_SMOKE_ARTIFACTS: ${{ runner.temp }}/nessa-native-smoke-artifacts
        run: xvfb-run --auto-servernum pnpm desktop:smoke
      - name: Exercise the disposable app package window
        timeout-minutes: 15
        run: xvfb-run --auto-servernum pnpm desktop:smoke --app-package
      - name: Upload native desktop smoke failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-window-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nessa-native-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  local-auth:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      # The Linux leg uses the shipping Linux baseline, the same image as
      # `linux-desktop` above, which owns the native verification
      # (ci-harness.test.mjs, issue #1167).
      # The macOS leg stays on macos-latest (Apple Silicon). Runs 42072698358
      # and 42079903038 cancelled it with no steps: "The job was not acquired
      # by Runner of type hosted even after multiple attempts", while a
      # separate release-profile job on the same label did get a runner. That
      # job's steps now run at the end of this leg, so one run asks the arm64
      # pool for one runner. macos-15-intel was tried on c4563c958 and is not
      # a substitute: 55 tests failed there, backup promotion with Retained
      # and Rename.
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        include:
          - os: windows-latest
            partition: remaining
          - os: ubuntu-22.04
            partition: all
          - os: macos-latest
            partition: all
    runs-on: ${{ matrix.os }}
    # The apt step can run 65 minutes and the Rust tests can run to their own
    # 60 (#366). On the 21 green Ubuntu legs of 2026-10-07, every other step
    # together was at most 11.3 minutes in one run. 65 + 60 + 11.3 is 136.3,
    # so 140 minutes lets both step bounds finish before the job does.
    # Windows, which does not install these packages, took at most 27.9.
    timeout-minutes: 140
    env:
      NESSA_DESKTOP_PERFORMANCE: ${{ github.event_name == 'workflow_dispatch' && inputs['desktop-performance'] && matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-crypto
        if: runner.os == 'Windows'
      # Windows runs these tests many times slower than Linux (run 43811777001:
      # the conversation library took 1,296 s here and 131 s on Ubuntu), and
      # the slowest cases are the ones that save files. The default temp
      # directory is on the system drive; the workspace drive is the runner's
      # faster disk. This is a measurement first: the comparison is in the
      # pull request that added it.
      - name: Keep Windows test files on the workspace drive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nessa-tests"
          directory="$(cygpath -w "$RUNNER_TEMP/nessa-tests")"
          echo "TEMP=$directory" >> "$GITHUB_ENV"
          echo "TMP=$directory" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          # Rust's host triple does not distinguish Ubuntu's glibc baseline.
          # Keep other platforms' existing shared cache keys unchanged.
          key: ${{ runner.os == 'Linux' && matrix.os || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Opt-in evidence uses the Mac already allocated to this matrix leg.
      # It runs before Rust work, with the same browser/measurement owner as
      # local verification. No second required job or weaker budget is added.
      - name: Install optional desktop measurement dependencies
        if: env.NESSA_DESKTOP_PERFORMANCE == 'true'
        uses: ./.github/actions/pnpm-install
      - name: Install the optional desktop measurement browser
        if: env.NESSA_DESKTOP_PERFORMANCE == 'true'
        run: pnpm exec playwright install chromium
      - name: Record the desktop measurement host
        if: env.NESSA_DESKTOP_PERFORMANCE == 'true'
        shell: bash
        run: |
          sw_vers
          sysctl -n hw.model hw.ncpu
          uptime
          node --input-type=module <<'JS'
          import { launch } from './verification/desktop/scripts/lib/browser.mjs'
          const browser = await launch('chromium', { channel: 'bundled', headed: true })
          try {
            const session = await browser.newBrowserCDPSession()
            const { gpu } = await session.send('SystemInfo.getInfo')
            console.log(JSON.stringify({ browser: browser.version(), gpu }))
          } finally { await browser.close() }
          JS
      - name: Measure the desktop frame budget on Mac
        if: env.NESSA_DESKTOP_PERFORMANCE == 'true'
        run: node verification/desktop/scripts/perf-budget.mjs --mode prod --headed --engine chromium --layout columns,sidebar --channel bundled --runs 5 --out "${{ runner.temp }}/desktop-performance.json"
      - name: Keep the desktop measurement in its job log
        if: always() && env.NESSA_DESKTOP_PERFORMANCE == 'true'
        shell: bash
        run: |
          # Logs retain the full measurements and LoAF attribution without
          # creating a separate stored workflow artifact.
          if test -f "$RUNNER_TEMP/desktop-performance.json"; then
            cat "$RUNNER_TEMP/desktop-performance.json"
          fi
      - run: node --test scripts/product-protocol/rust-types.test.mjs
      # Duplicated by `cargo fmt --all` in `gateway-contract`, and staying
      # anyway. `scripts/desktop/ci-harness.test.mjs` requires this exact line,
      # because what it is really holding together is that `pnpm check` and
      # this workflow aggregate the same named checks — `check` runs
      # `server:fmt:check`, `auth:fmt:check` and `sdk:fmt:check` per crate, so
      # CI does too. Dropping it saved 28 seconds on Windows and cost that
      # guarantee, which is not a trade worth making. `database:check`'s fmt is
      # the exception: `cargo fmt --all` in `gateway-contract` covers it.
      - run: cargo fmt -p nessa-local-storage -p nessa-auth -p nessa-server -p nessa-conversation -p nessa-gateway -p nessa-protocol -p nessa-projection -p nessa-types -p nessa-client-core -p nessa-device-client -p nessa-sdk -p nessa-timer -p nessa-vault -p nessa-agent-install -p nessa-attachments -p nessa-peer-gateways -p nessa-mcp-authorization -p nessa-webhooks -p nessa-device-pairing -p nessa-backup -p nessa-telemetry -- --check
      - run: node --test scripts/architecture/*.test.mjs
      - run: node --test scripts/agents/*.test.mjs
      - run: node scripts/check-architecture.mjs
      # Endpoint file publication crosses the platform-specific local-storage
      # adapters, so each OS gives a different answer. Lint this new crate before
      # its tests; the package group below also lints before its runtime tests.
      - run: cargo clippy -p nessa-gateway-endpoint --all-targets -- -D warnings
      - run: cargo test -p nessa-gateway-endpoint
      # The database opener's privacy checks cross the same platform-specific
      # adapters, so each OS gives its own answer to them too.
      - run: cargo clippy -p nessa-local-database --all-targets -- -D warnings
      - run: cargo test -p nessa-local-database
      # This owns the WKWebView nil-URL deadline acceptance independently of
      # the shared server suite. Compile with warnings denied before running.
      - name: Qualify the native missing-page deadline
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "::add-matcher::src-tauri/examples/page_load_acceptance/rustc.json"
          trap 'echo "::remove-matcher owner=page-load-compiler::"' EXIT
          cargo clippy -p nessa-app --no-default-features --example page_load_acceptance --color never -- -D warnings
          # A permissive temporary parent must not become the private log directory.
          umask 022
          cargo run -p nessa-app --no-default-features --example page_load_acceptance | tee "$RUNNER_TEMP/page-load-acceptance.txt"
          while IFS= read -r line; do
            printf '::notice title=Native load acceptance::%s\n' "$line"
          done < "$RUNNER_TEMP/page-load-acceptance.txt"
      # Platform-only unused ports must fail before the long runtime suites.
      # Every Rust change runs this on all three systems: it is what catches a
      # `#[cfg(unix)]` item left dead on Windows. It always lists every crate,
      # so features unify as they do on `main`; crates the change cannot reach
      # come from the cache.
      - if: needs.changes.outputs.rust != 'false'
        run: cargo clippy -p nessa-local-storage -p nessa-auth -p nessa-server -p nessa-conversation -p nessa-gateway -p nessa-protocol -p nessa-projection -p nessa-types -p nessa-client-core -p nessa-device-client -p nessa-sdk -p nessa-timer -p nessa-vault -p nessa-agent-install -p nessa-attachments -p nessa-peer-gateways -p nessa-mcp-authorization -p nessa-webhooks -p nessa-device-pairing -p nessa-backup -p nessa-telemetry --all-targets -- -D warnings
      # A test that deadlocks here held this job for six hours, until GitHub's
      # job limit cancelled it (#366). Over 53 green runs this step took at most
      # 7 minutes on Linux, 11 on macOS and 19 on Windows, compile included, so
      # 45 minutes is a margin over a cold cache rather than a tight fit. The
      # stuck test is still named: libtest prints "has been running for over 60
      # seconds" for each test still running, and that line is in the log before
      # the step is cancelled.
      #
      # The package list is still one cargo invocation (`--no-run`), so feature
      # unification does not change. scripts/cargo-test-parallel.mjs then runs
      # the built test binaries two at a time and runs doctests with the same
      # packages. Windows remaining also runs the four seeded catalogue cases;
      # windows-server-tests runs the complementary server library cases.
      # Linux/macOS use all. It does not raise libtest's thread count:
      # the ACP
      # process-contract semaphore is process-local, and a process-per-test
      # runner would make that semaphore admit every contract test at once.
      # #777: one controlled isolated observation before the unchanged package
      # selection below. Aggregate phases per command so the notice limit
      # cannot hide device/drain timings. No raw log access or retry is needed.
      - name: Locate the Windows one-thread enrollment timeout
        if: runner.os == 'Windows' && needs.changes.outputs.platform_tests != 'false'
        shell: bash
        run: |
          observe_phases() {
            "$@" 2>&1 | awk '
              {
                print; fflush()
                if ($0 ~ /^one-thread-phase / || $0 ~ /^test result:/) {
                  line = $0
                  gsub(/%/, "%25", line)
                  gsub(/\r/, "%0D", line)
                  phases = phases line "%0A"
                }
              }
              END {
                if (phases != "") printf "::notice title=One-thread enrollment phases::%s\n", phases
              }
            '
          }
          observe_phases cargo test -p nessa-server --test native_enrollment enrollment::native_gateway_runs_on_a_one_thread_blocking_pool -- --exact --nocapture
          observe_phases cargo test -p nessa-server --test native_enrollment one_thread:: -- --nocapture
        timeout-minutes: 45
      # Every leg builds and doctests the full list, so features unify as they
      # do on `main`. Ubuntu then runs only the test binaries of the crates the
      # change can reach (`--run-packages`; empty runs all). macOS and Windows
      # run their suites only when the plan says platform code changed, and
      # then all of them, which Windows' `remaining` partition needs whole.
      - shell: bash
        if: needs.changes.outputs.rust != 'false' && (runner.os == 'Linux' || needs.changes.outputs.platform_tests != 'false')
        run: node scripts/cargo-test-parallel.mjs --concurrency 2 --partition ${{ matrix.partition }} --run-packages "${{ runner.os == 'Linux' && needs.changes.outputs.rust_packages || '' }}" -- -p nessa-local-storage -p nessa-auth -p nessa-server -p nessa-conversation -p nessa-gateway -p nessa-protocol -p nessa-projection -p nessa-types -p nessa-client-core -p nessa-device-client -p nessa-sdk -p nessa-timer -p nessa-vault -p nessa-agent-install -p nessa-attachments -p nessa-peer-gateways -p nessa-mcp-authorization -p nessa-webhooks -p nessa-device-pairing -p nessa-backup -p nessa-telemetry
        # macOS ran this in 41.6 minutes on main (run 41708958692, 2026-11-03)
        # and hit 45 twice on one PR the same night; 60 still ends a deadlock
        # long before the job does (#366).
        timeout-minutes: 60
      # Passing libtest output is normally captured. Keep these bounded native
      # receipts visible even when a separate strict fixture precondition fails.
      - name: Capture native retained-file security query order
        if: runner.os == 'Windows' && !cancelled() && needs.changes.outputs.platform_tests != 'false'
        shell: bash
        run: cargo test -p nessa-local-storage --lib fresh_hardlink_security_queries_reverse_provider_order_without_inheritance_assumptions -- --nocapture
        timeout-minutes: 5
      - run: node scripts/check-sdk-docs.mjs
      # Not on Linux: `gateway-contract` is an ubuntu-latest job and already
      # runs exactly what this script runs — fmt, clippy and test for
      # nessa-mcp — so a Linux run here is a second cold compile of that crate
      # for an answer already given. macOS is not covered there and is not the
      # same answer: what this crate supervises is native processes. The script
      # itself declines to run on Windows.
      - run: node scripts/check-mcp.mjs
        if: runner.os == 'macOS'
      # Linux runs this in `linux-desktop`, beside the packages it needs.
      - run: node scripts/check-desktop.mjs
        if: runner.os != 'Linux'
      # Hosted Windows runners are administrators with UAC off, so this leg can
      # prove the Task Scheduler identity and cleanup agreement only for an
      # elevated caller, and declares that. The product's standard-user model
      # (the script's default) still needs a non-elevated interactive session;
      # #205 records that as open.
      - name: Prove the Windows Task Scheduler gateway model
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/desktop/check-windows-task-scheduler.ps1 -CallerContext Administrator
      # The gateway binary the SDK integration harness below copies.
      - run: cargo build -p nessa-server
      # Auth/SDK checks do not need the desktop UI's separate repository. Use an
      # isolated minimal npm harness so this job has no UI checkout credentials.
      - name: Prepare SDK integration harness
        shell: python
        run: |
          import json, pathlib, shutil
          root = pathlib.Path('.ci-auth')
          root.mkdir()
          shutil.copytree('packages/nessa-client', root / 'packages/nessa-client')
          shutil.copytree('scripts', root / 'scripts')
          shutil.copytree('crates/nessa-sdk/data', root / 'crates/nessa-sdk/data')
          # The scripts resolve stage defaults — the gateway port among them —
          # from `protocol/`, relative to the tree they are in. Copied because
          # the harness is that tree here, not the checkout beside it.
          shutil.copytree('protocol/defaults', root / 'protocol/defaults')
          target = root / 'target/debug'
          target.mkdir(parents=True)
          binary = 'nessa.exe' if '${{ runner.os }}' == 'Windows' else 'nessa'
          shutil.copy2(pathlib.Path('target/debug') / binary, target / binary)
          shutil.copy2('.github/harnesses/local-auth/package.json', root / 'package.json')
          shutil.copy2('.github/harnesses/local-auth/package-lock.json', root / 'package-lock.json')
      - run: npm ci --ignore-scripts
        working-directory: .ci-auth
      - run: node --test scripts/conversation-smoke/*.test.mjs
        working-directory: .ci-auth
        if: runner.os == 'Linux'
      - run: node --import tsx scripts/smoke-conversation.mjs
        working-directory: .ci-auth
        if: runner.os == 'Linux'
      - run: node --import tsx scripts/smoke-windows-private-files.ts
        working-directory: .ci-auth
        if: runner.os == 'Windows'
      - run: node --import tsx scripts/smoke-auth.mjs
        working-directory: .ci-auth
      # What `install-agent` writes to stdout is an interface the desktop reads,
      # and only the real process can be held to it. On a runner Nessa pins a
      # build for this also fetches that archive and checks it against the
      # compiled-in digest, which is the one place those digests are verified
      # against the registry rather than trusted.
      - run: node --import tsx scripts/smoke-install-agent.mjs
        working-directory: .ci-auth
      # The desktop app compiled the way a release compiles it, and nothing more.
      #
      # `cfg(debug_assertions)` is off in the release profile, so code gated on it
      # disappears and anything still naming it stops compiling. Every other step
      # here builds in debug, so that break is invisible until a tag is pushed —
      # which is exactly how v0.1.0 failed, twenty minutes into a signed macOS
      # build, on `SIMULATED_UPDATE` being gated while its one release-profile
      # reader was not.
      #
      # macOS is the one release-profile answer here. Linux compiles and exercises
      # its systemd adapter in `linux-desktop` through `check-desktop.mjs`; these
      # steps catch code that disappears only when `cfg(debug_assertions)` is off.
      # `cargo check`, not a build: this is about what compiles, and the release
      # workflow remains the only thing that produces a bundle. The frontend is
      # built first because `generate_context!` embeds `dist/`, which has to exist
      # before the crate can be checked at all. `scripts/desktop/prepare.mjs` is
      # not run for it: the tree it assembles is not a compile-time input
      # (`tauri.conf.json` declares no `bundle.resources`).
      #
      # These steps were a macOS job of their own, `desktop-release-profile`,
      # and this job waited for it so the two did not ask for the arm64 pool at
      # once. That wait was three to four minutes in front of all three legs,
      # the Windows one included, which is the longest job in the run. Here
      # they use the Mac this leg already has, after its tests, and take about
      # two and a half minutes of it.
      - name: Install the frontend's dependencies for the release-profile check
        if: runner.os == 'macOS'
        uses: ./.github/actions/pnpm-install
        with:
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the frontend the desktop app embeds
        if: runner.os == 'macOS'
        run: pnpm build
      - name: Check the desktop app compiles in release profile
        if: runner.os == 'macOS'
        run: cargo check -p nessa-app --release --all-targets

  # Linux used to run this after runtime assembly on the matrix leg: about nine
  # minutes of instrumented tests, serial, on a fresh target directory. The
  # instrumentation does not share artifacts with that assembly or with the
  # ordinary test build, so it runs beside them. The 100% domain thresholds and
  # the single test thread stay in scripts/check-sdk-domain-coverage.sh.
  # Dependencies and workspace crates are cached under a prefix of their own;
  # rust-cache would otherwise keep only dependencies, and only from `target/`.
  sdk-domain-coverage:
    name: SDK domain coverage
    needs: changes
    # Only when the change can reach `nessa-sdk` (`scripts/ci-plan.mjs`).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.sdk != 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/sdk-domain-coverage
      NESSA_SDK_COVERAGE_TARGET: target/sdk-domain-coverage
    # The instrumented suite took at most 11.9 minutes in that sample, and its
    # step bound is 40 minutes (#366). Sixty minutes lets that step bound fire
    # before the job does.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.rust-cache != 'cold' }}
        with:
          prefix-key: sdk-domain-coverage
          workspaces: ". -> target/sdk-domain-coverage"
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        env:
          VERSION: 0.9.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin cargo-llvm-cov
      # The same deadlock margin as the ordinary SDK tests (#366). Over 36
      # green runs the serial instrumented suite took at most 11 minutes.
      - name: Require complete SDK domain coverage
        run: bash scripts/check-sdk-domain-coverage.sh
        timeout-minutes: 40

  # A skipped required check counts as a pass. scripts/ci-result.mjs is what
  # refuses that: every job above has to have run and passed, except that a
  # documentation-only change may skip the compile jobs and nothing else.
  required-checks:
    name: Required checks passed
    needs:
      - workflows
      - changes
      - gateway-contract
      - frontend
      - conversation-checks
      - conversation-stress
      - linux-desktop
      - local-auth
      - windows-server-tests
      - sdk-domain-coverage
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # At most 0.2 minutes in that sample. Ten minutes bounds a hung checkout.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-result.mjs
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Fail unless every owned check ran and passed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: node scripts/ci-result.mjs
