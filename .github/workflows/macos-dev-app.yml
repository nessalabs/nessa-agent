# Build the macOS desktop host for a snapshot of someone's working tree, so a
# laptop can run it without compiling Rust (#358).
#
# scripts/remote/macos-app.sh commits the tree as it is on disk — uncommitted and
# untracked files included, the branch and index untouched — force-pushes that
# commit to ci/scratch/<login>, and downloads what this uploads. The binary is
# the debug host without `custom-protocol`, the same one `tauri dev` runs: it
# loads its page from the dev server on 127.0.0.1:1420 rather than embedding
# one, so UI edits reach it through Vite and only host changes need this build.
#
# Not a check: it never runs on pull requests, and local-auth.yml stays the
# gate. Two people, or two worktrees, pushing at once each get their own run.
name: macOS dev app
run-name: macOS dev app ${{ github.sha }}
on:
  push:
    # main only to keep a warm Rust cache that scratch builds read; nothing is
    # uploaded for it.
    branches: [main, "ci/scratch/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build nessa-app (debug, aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Written only from main, like every other build cache here: a scratch
      # build reads main's and never evicts it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-dev-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Without custom-protocol, build.rs needs no frontend: the page comes
      # from the dev server.
      - name: Build
        env:
          NESSA_STAGE: dev
        run: cargo build -p nessa-app --no-default-features
      # What this binary was built from, for scripts/remote/macos-app.sh to
      # compare against a laptop's tree.
      - name: List inputs
        if: github.ref != 'refs/heads/main'
        run: python3 scripts/remote/host_inputs.py from-depinfo target/debug/nessa-app.d "$PWD" > target/debug/inputs.txt
      # tar keeps the executable bit and the linker's ad-hoc signature, which an
      # Apple Silicon Mac needs to run it.
      - name: Package
        if: github.ref != 'refs/heads/main'
        run: tar -C target/debug -czf nessa-app.tar.gz nessa-app inputs.txt
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: nessa-app
          path: nessa-app.tar.gz
          retention-days: 7
