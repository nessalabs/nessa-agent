[package]
name = "nessa-gateway-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Private publication and correlation of a local Nessa gateway endpoint"

[dependencies]
nessa-local-storage = { path = "../nessa-local-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"
uuid = "1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
