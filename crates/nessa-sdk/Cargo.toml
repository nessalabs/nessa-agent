[package]
name = "nessa-sdk"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "Reusable agent application contracts for Nessa"
publish = false

[dependencies]
data-encoding = "2.11"
sha2 = "0.10"
nessa-local-storage = { path = "../nessa-local-storage" }
tracing = "0.1"
event-stream = { git = "https://github.com/nessalabs/event-stream", rev = "66ba7525260040d6265276692088dca6dae0737e", default-features = false, features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
