[package]
name = "nessa-sdk"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "Reusable agent application contracts for Nessa"
publish = false

[dependencies]
async-trait = "=0.1.92"
data-encoding = "2.11"
sha2 = "0.10"
base64 = "0.22"
nessa-local-storage = { path = "../nessa-local-storage" }
nessa-local-database = { path = "../nessa-local-database" }
tracing = "0.1"
event-stream = { git = "https://github.com/nessalabs/event-stream", rev = "59624a2", default-features = false, features = ["codec", "sqlite", "retention"] }
nessa-sync.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time", "net"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
markdown = "1.0"
percent-encoding = "2"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
