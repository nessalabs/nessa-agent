[package]
name = "nessa-vault"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish = false

[dependencies]
nessa-local-storage = { path = "../nessa-local-storage" }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
chacha20poly1305 = "=0.10.1"
getrandom = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "=1.9.0"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
