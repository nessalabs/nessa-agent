[package]
name = "nessa-local-database"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
nessa-local-storage = { path = "../nessa-local-storage" }
# `backup` copies an export read snapshot after admission has been released.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup"] }

[dev-dependencies]
tempfile = "3"
