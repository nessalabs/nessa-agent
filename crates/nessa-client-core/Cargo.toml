[package]
name = "nessa-client-core"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish = false
description = "Device-side enrollment and retained gateway sync"

[features]
default = ["cli"]
# The standalone example's command line: argument parsing, JSON presentation
# and the retained-sync composition behind them. A peer gateway links this
# crate for its client without it (ADR 483).
cli = []

[[example]]
name = "read_only_sync"
required-features = ["cli"]

[[example]]
name = "weak_link_measure"

[dependencies]
base64 = "0.22"
nessa-auth = { path = "../nessa-auth" }
nessa-protocol = { path = "../nessa-protocol" }
nessa-sdk = { path = "../nessa-sdk" }
nessa-sync = { workspace = true }
nessa-local-database = { path = "../nessa-local-database" }
nessa-local-storage = { path = "../nessa-local-storage" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS to a web tunnel's edge (`tunnel`), checked against the platform's trust
# store; the gateway itself is proved by the native TLS inside.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = "0.1"
tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }
# Bounded native-only key correlation keeps its temporary seed copy zeroizing.
zeroize = "=1.9.0"

[dev-dependencies]
# The unmarked checkpoint fixture. A production build of this crate does not
# enable it.
nessa-sdk = { path = "../nessa-sdk", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
