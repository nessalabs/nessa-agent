[package]
name = "nessa-projection"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish = false
autotests = false
description = "The one bounded fold of a conversation's committed SDK records into the protocol's conversation view"

[dependencies]
nessa-protocol = { path = "../nessa-protocol" }
nessa-sdk = { path = "../nessa-sdk" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nessa-sdk = { path = "../nessa-sdk", features = ["test-support"] }
