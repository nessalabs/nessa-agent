[package]
name = "nessa-protocol"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish = false
description = "What any client of the Nessa gateway needs to speak to it: wire frames, generated product DTOs, codecs, native pairing framing, and the conversation read model"

[dependencies]
base64 = "0.22"
nessa-auth = { path = "../nessa-auth" }
nessa-sdk = { path = "../nessa-sdk" }
nessa-sync = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
nessa-local-storage = { path = "../nessa-local-storage" }
