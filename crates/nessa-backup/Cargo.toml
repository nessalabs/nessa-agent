[package]
name = "nessa-backup"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish = false
autotests = false
description = "A consistent export cut of the gateway's stores and its deletion inventory, the bundle verifier, offline restore planning, and quarantined restore"

[features]
# Lets nessa-server's tests reach the restore internals they drive.
test-support = []

[dependencies]
nessa-auth = { path = "../nessa-auth" }
nessa-local-database = { path = "../nessa-local-database", features = ["encryption"] }
nessa-local-storage = { path = "../nessa-local-storage" }
nessa-protocol = { path = "../nessa-protocol" }
nessa-timer = { path = "../nessa-timer", features = ["runtime"] }
async-trait = "0.1"
# The deletion inventory's policy, the same pinned build nessa-auth embeds.
cedar-policy = { version = "=4.12.0", default-features = false }
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# macOS compares composed and decomposed names as one path. The fold is pure
# so the same rule can be checked on Linux.
unicode-normalization = "0.1.25"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# An interrupted lease line is the environment ledger's own record.
nessa-env-serve = { path = "../nessa-env-serve", features = ["test-support"] }

[lints]
workspace = true
