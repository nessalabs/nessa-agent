[package]
name = "nessa-server"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "Nessa Client API server (WebSocket control plane)"
default-run = "nessa"

[lib]
name = "nessa_server"
path = "src/lib.rs"

[[bin]]
name = "nessa"
path = "src/main.rs"

[[bin]]
name = "nessa-backup-verify"
path = "src/backup_verify_main.rs"

[[bin]]
name = "nessa-backup-plan"
path = "src/backup_plan_main.rs"

[dependencies]
base64 = "0.22"
# The local-network announcement while native linking listens there
# (device_pairing::infrastructure::announcer), so a phone that scanned the
# desktop's code finds the gateway. No async runtime of its own.
mdns-sd = { version = "0.21", default-features = false }
nessa-protocol = { path = "../nessa-protocol" }
# A peer gateway dials another gateway as a client (ADR 483, amended for slice
# H of ADR 252). Without the example's command line.
nessa-client-core = { path = "../nessa-client-core", default-features = false }
nessa-sdk = { path = "../nessa-sdk" }
nessa-sync = { workspace = true }
nessa-images = { path = "../nessa-images" }
nessa-local-database = { path = "../nessa-local-database" }
nessa-local-storage = { path = "../nessa-local-storage", features = ["physical-operation"] }
nessa-gateway-endpoint = { path = "../nessa-gateway-endpoint" }
nessa-auth = { path = "../nessa-auth" }
nessa-agent-credentials = { path = "../nessa-agent-credentials" }
axum = { version = "0.8", features = ["ws"] }
# Name the bounded HTTP-body rejection separately from transport read failures.
http-body-util = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps each mcpServers entry's original JSON so a repeated
# `env` name is still visible. Decoding the entry as a `Value` first would
# keep one of the two.
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
socket2 = "0.6"
# Installing an agent's own runtime: fetch an archive, hash it, unpack one file.
# `reqwest` is blocking here on purpose — see `agent_install::infrastructure`.
# Response compression is deliberately absent: the archive's digest is taken
# over the bytes on the wire, so a transport that silently decompressed them
# would hash something the pin was never measured against.
# Taken without a TLS backend, which `agent_install::infrastructure` then names
# — the same way `tauri` and `tauri-plugin-updater` take it. The `rustls`
# feature would name one instead, and name it for every crate in the build
# graph that shares this dependency: cargo unifies features, so the agent
# installer would be choosing the cryptography the desktop's updater ships
# with, and pulling `aws-lc-sys` — a C and assembly build — into a gateway
# that has no need of it.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "http2", "stream"] }
async-trait = "0.1"
# Only to name that backend. *ring* is the one this build already has, and the
# one both Tauri crates install, so a workspace build holds a single
# implementation rather than two.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
# A resolved Windows path without the `\\?\` prefix, so a channel's folder is
# kept, shown and handed to an agent as the person knows it.
dunce = "1"
# macOS compares composed and decomposed names as one path. The fold is pure
# so the same rule can be checked on Linux.
unicode-normalization = "0.1.25"
# The tool policy's evaluator (conversation/infrastructure/tool_policy/cedar),
# the environment host's lease policy (env_serve/infrastructure/cedar), and
# the deletion inventory (backup/infrastructure/cedar), the same
# pinned build nessa-auth embeds.
cedar-policy = { version = "=4.12.0", default-features = false }
# Keying each MCP server's configuration digest with a per-process secret,
# so a stand-in's arguments say nothing about its variables' values.
hmac = "0.12"
subtle = "2.6"
flate2 = "1"
tar = "0.4"
# Parsing a pinned archive URL, rather than matching on its spelling.
url = "2"

# Already built for cedar-policy. The example client refuses an acknowledged
# watch identity outside the schema-published pattern; tests match minted
# identities against the same pattern.
regex = "1"

[target.'cfg(unix)'.dependencies]
# Opening the gateway log without following a link where it should be.
libc = "0.2"
# `nessa env serve` runs command leases' commands in process scopes of their
# own, as the Nessa MCP shell tool does; the same pinned revision.
shepherd = { git = "https://github.com/nessalabs/shepherd", rev = "26bd7cb8843c1bc6c3eccfbbae8be926f8c49103" }
# The web tunnel's loopback ingress accepts the provider's WebSockets
# (`docs/design/auth/tunnel.md`); already in the build graph through axum and
# nessa-client-core, same version.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Nessa-owned agent API keys live in the login keychain. This crate is already
# in the desktop dependency graph; naming it here exposes the typed Security
# framework API without putting a secret in a subprocess argument.
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
# Cancel actual HTTP service futures at a deterministic command-storage gate.
tower = { version = "0.5", features = ["util"] }
# Online process tests drive the example's command entry point.
nessa-client-core = { path = "../nessa-client-core", features = ["cli"] }
# Actual native-session tests share the existing paired gateway process fixture.
nessa-device-client = { path = "../nessa-device-client" }
# Plants an unmarked session record. A production build of this crate does not
# enable it.
nessa-sdk = { path = "../nessa-sdk", features = ["test-support"] }
tempfile = "3"
# Only to build the private key material a test record store double returns;
# already in the build graph through nessa-auth.
zeroize = "=1.9.0"
tokio = { version = "1", features = ["test-util", "io-util"] }
# Only to build the pixels a substitute system decoder hands back. The image
# library this workspace already compiles; nothing new is built.
image = { version = "0.25.10", default-features = false }
# Only to drive a real WebSocket write buffer over an in-memory duplex (row
# R64), and to dial the tunnel ingress in its tests; already in the build
# graph through axum, same version.
tokio-tungstenite = "0.29"
