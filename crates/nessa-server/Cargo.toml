[package]
name = "nessa-server"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "Nessa Client API server (WebSocket control plane)"

[lib]
name = "nessa_server"
path = "src/lib.rs"

[[bin]]
name = "nessa-server"
path = "src/main.rs"

[dependencies]
nessa-local-storage = { path = "../nessa-local-storage" }
nessa-auth = { path = "../nessa-auth" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
