[package]
name = "nessa-server"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "Nessa Client API server (WebSocket control plane)"

[lib]
name = "nessa_server"
path = "src/lib.rs"

[[bin]]
name = "nessa"
path = "src/main.rs"

[dependencies]
nessa-sdk = { path = "../nessa-sdk" }
nessa-local-storage = { path = "../nessa-local-storage" }
nessa-auth = { path = "../nessa-auth" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
# Installing an agent's own runtime: fetch an archive, hash it, unpack one file.
# `reqwest` is blocking here on purpose — see `agent_install::infrastructure`.
# Response compression is deliberately absent: the archive's digest is taken
# over the bytes on the wire, so a transport that silently decompressed them
# would hash something the pin was never measured against.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "http2"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# Parsing a pinned archive URL, rather than matching on its spelling.
url = "2"

[target.'cfg(unix)'.dependencies]
# Opening the gateway log without following a link where it should be.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
