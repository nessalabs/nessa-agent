[package]
name = "nessa-server"
version.workspace = true
edition.workspace = true
rust-version = "1.89"
description = "Nessa Client API server (WebSocket control plane)"
default-run = "nessa"

[lib]
name = "nessa_server"
path = "src/lib.rs"

[[bin]]
name = "nessa"
path = "src/main.rs"

[[bin]]
name = "nessa-backup-verify"
path = "src/backup_verify_main.rs"

[[bin]]
name = "nessa-backup-plan"
path = "src/backup_plan_main.rs"

[[bin]]
name = "nessa-backup-restore"
path = "src/backup_restore_main.rs"

[features]
# Terminals in the gateway (docs/design/terminals.md); needs the pinned Ghostty
# library, named by PTY_RUNTIME_GHOSTTY_SOURCE (scripts/terminal/ghostty.sh).
terminals = ["nessa-gateway/terminals"]

[dependencies]
# The request path this crate composes and starts.
nessa-gateway = { path = "../nessa-gateway" }
tempfile = "3"
nessa-vault = { path = "../nessa-vault" }
nessa-agent-install = { path = "../nessa-agent-install" }
nessa-attachments = { path = "../nessa-attachments" }
nessa-peer-gateways = { path = "../nessa-peer-gateways" }
nessa-mcp-authorization = { path = "../nessa-mcp-authorization" }
nessa-webhooks = { path = "../nessa-webhooks" }
nessa-device-pairing = { path = "../nessa-device-pairing" }
nessa-backup = { path = "../nessa-backup" }
nessa-conversation = { path = "../nessa-conversation" }
# Turn and decision spans, sent only where config.json turns a sink on.
nessa-telemetry = { path = "../nessa-telemetry", features = ["otel"] }
base64 = "0.22"
nessa-protocol = { path = "../nessa-protocol" }
nessa-projection = { path = "../nessa-projection" }
# A peer gateway dials another gateway as a client (ADR 483, amended for slice
# H of ADR 252). Without the example's command line.
nessa-client-core = { path = "../nessa-client-core", default-features = false }
nessa-sdk = { path = "../nessa-sdk" }
nessa-sync = { workspace = true }
nessa-images = { path = "../nessa-images" }
nessa-local-database = { path = "../nessa-local-database", features = ["encryption"] }
zeroize = "=1.9.0"
nessa-local-storage = { path = "../nessa-local-storage", features = ["physical-operation"] }
nessa-gateway-endpoint = { path = "../nessa-gateway-endpoint" }
nessa-auth = { path = "../nessa-auth" }
nessa-types = { path = "../nessa-types" }
nessa-agent-credentials = { path = "../nessa-agent-credentials" }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps each mcpServers entry's original JSON so a repeated
# `env` name is still visible. Decoding the entry as a `Value` first would
# keep one of the two.
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util", "io-std", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }
# The GitHub relay's HTTP client (composition::github_relay); the gateway
# declares the same features, so the build's merged features do not change.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "http2", "stream", "json"] }
async-trait = "0.1"
# Only to name that backend. *ring* is the one this build already has, and the
# one both Tauri crates install, so a workspace build holds a single
# implementation rather than two.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
workspace_sdk = { git = "https://github.com/nessalabs/workspace-sdk", rev = "89fec09eb27786d67fe71380f64c1070df4cf096" }
# Opening the gateway log without following a link where it should be.
libc = "0.2"
# `nessa env serve` runs command leases' commands in process scopes of their
# own, as the Nessa MCP shell tool does; the same pinned revision.
shepherd = { git = "https://github.com/nessalabs/shepherd", rev = "85ee0d55acabf5f91b8cac2e925872d044514864" }

[dev-dependencies]
nessa-gateway = { path = "../nessa-gateway", features = ["test-support"] }
# The conversation fixtures the gateway's own tests build conversations with.
nessa-conversation = { path = "../nessa-conversation", features = ["test-support"] }
time = "0.3"
# Online process tests drive the example's command entry point.
nessa-client-core = { path = "../nessa-client-core", features = ["cli", "test-support"] }
nessa-agent-install = { path = "../nessa-agent-install", features = ["test-support"] }
nessa-attachments = { path = "../nessa-attachments", features = ["test-support"] }
# Actual native-session tests share the existing paired gateway process fixture.
nessa-device-client = { path = "../nessa-device-client" }
# Lets composition tests watch a peer's read cycles and slow its audit writer.
nessa-peer-gateways = { path = "../nessa-peer-gateways", features = ["test-support"] }
nessa-webhooks = { path = "../nessa-webhooks", features = ["test-support"] }
nessa-device-pairing = { path = "../nessa-device-pairing", features = ["test-support"] }
nessa-backup = { path = "../nessa-backup", features = ["test-support"] }
# Plants an unmarked session record. A production build of this crate does not
# enable it.
nessa-sdk = { path = "../nessa-sdk", features = ["test-support"] }
nessa-timer = { path = "../nessa-timer", features = ["test-support"] }
tokio = { version = "1", features = ["test-util", "io-util"] }
# Composition tests dial the tunnel ingress and the session socket; already
# in the build graph through axum, same version.
tokio-tungstenite = "0.29"

[lints]
workspace = true
