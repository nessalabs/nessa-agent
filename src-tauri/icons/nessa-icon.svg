<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bloom-0" gradientUnits="userSpaceOnUse" cx="512" cy="446.08" r="972.32" gradientTransform="translate(0 446.08) scale(1 0.78) translate(0 -446.08)">
      <stop offset="0" stop-color="#f9a86a" stop-opacity="1"/>
      <!-- The colour's own alpha goes to zero rather than fading to a
           transparent black, which would dirty the wash on the way out. -->
      <stop offset="0.74" stop-color="#f9a86a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom-1" gradientUnits="userSpaceOnUse" cx="808.64" cy="165.92" r="642.72" gradientTransform="translate(0 165.92) scale(1 1.051) translate(0 -165.92)">
      <stop offset="0" stop-color="#f7bfa6" stop-opacity="1"/>
      <!-- The colour's own alpha goes to zero rather than fading to a
           transparent black, which would dirty the wash on the way out. -->
      <stop offset="0.74" stop-color="#f7bfa6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom-2" gradientUnits="userSpaceOnUse" cx="198.88" cy="891.04" r="692.16" gradientTransform="translate(0 891.04) scale(1 1.048) translate(0 -891.04)">
      <stop offset="0" stop-color="#e6b6d2" stop-opacity="1"/>
      <!-- The colour's own alpha goes to zero rather than fading to a
           transparent black, which would dirty the wash on the way out. -->
      <stop offset="0.74" stop-color="#e6b6d2" stop-opacity="0"/>
    </radialGradient>
    <!-- The rim fade. The painting is clipped to a circle, and without this it
         ends on a hard arc wherever a stroke runs out to the edge. -->
    <radialGradient id="feather">
      <stop offset="0.62" stop-color="#fff"/>
      <stop offset="0.84" stop-color="#8c8c8c"/>
      <stop offset="0.97" stop-color="#000"/>
    </radialGradient>
    <mask id="feather-mask">
      <rect x="256.56" y="256.56" width="510.88" height="510.88" fill="url(#feather)"/>
    </mask>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="face">
      <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"/>
    </clipPath>
  </defs>

  <!-- Everything is clipped to the rounded square, so the blooms may run past
       the artwork's edge exactly as the CSS ones run past the box. -->
  <g clip-path="url(#face)">
    <rect x="100" y="100" width="824" height="824" fill="#d3a9d8"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom-2)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom-1)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom-0)"/>

    <!-- Multiply is what drops the painting's near-white ground: white is its
         identity, so only the pigment survives to tint the wash. -->
    <g style="mix-blend-mode:multiply" mask="url(#feather-mask)">
