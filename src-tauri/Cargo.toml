[package]
name = "nessa-app"
version = "0.1.0"
description = "Nessa — a floating agent composer"
authors = ["Nessa Labs"]
edition = "2021"
# The lockfile pulls crates that need edition 2024 (icu_normalizer_data 2.x).
# Packaged rustc 1.83 cannot build it; rustup's stable can.
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nessa-local-storage = { path = "../crates/nessa-local-storage" }
# `macos-private-api` is what makes the transparent, undecorated window legal
# on macOS; `tray-icon` and `image-png` back the menu bar item.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
# The operating system's random source, for the one-shot tickets the picker
# mints. Already in the tree — `nessa-server` mints its upload tickets from the
# same crate, and this deliberately matches its strength rather than inventing a
# second, weaker way to be unguessable.
getrandom = "0.3"
# Already in the tree as Tauri's own async runtime. Named here for `tokio::time`
# alone: a filesystem call that never returns needs a deadline, and a deadline
# needs a timer the async runtime is already driving. Nothing new is compiled
# into the binary.
tokio = { version = "1", features = ["time"] }

# The frosted surface is a native NSVisualEffectView rather than a CSS
# `backdrop-filter`: on a transparent, undecorated macOS window the CSS filter
# samples the behind-window content through a path that does not map 1:1, which
# smears it down the panel as a stretched gradient.
# Desktop-only: the panel is summoned by an accelerator that has to work while
# another app is frontmost, and an update is something only a desktop build of
# Nessa installs over itself.
# The file picker is desktop-only for the same kind of reason: attaching a file
# by its path is a thing a desktop filesystem has, and a phone hands an app a
# document through its own share sheet rather than a path somebody browsed to.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
# Already in the tree as window-vibrancy's own dependencies, and named here
# only so `platform/macos` can observe AppKit's live resize notifications and
# place the webview inside the window. Nothing new is compiled into the binary.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView"] }
# `NSURL`, `NSString` and `NSError` are the added features: `attachments`
# asks the filesystem for a path's content type through `NSURLContentTypeKey`,
# which answers with a `UTType` and reports its failure as an `NSError`.
objc2-foundation = { version = "0.3", features = [
  "NSNotification",
  "NSOperation",
  "NSURL",
  "NSString",
  "NSError",
  # `NSFileManager` is how a file iCloud is keeping elsewhere is asked for:
  # `startDownloadingUbiquitousItemAtURL:` begins the fetch and
  # `NSURLUbiquitousItemDownloadingStatusKey` says when it has landed.
  "NSFileManager",
  "block2",
] }
# The one genuinely new crate here, and the sibling of the objc2 crates above.
# `UTType` is how macOS turns a Uniform Type Identifier into the MIME type the
# panel branches on, and it lives in its own framework rather than in Foundation
# or AppKit. Without it the host would have to guess a type from an extension,
# which is the thing this exists to stop.
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree as wry's own dependencies. Named here so
# `platform/linux` can pin the WebKitGTK widget the same way the macOS side
# pins WKWebView, and so the pin can put the webview's transparent background
# back after reparenting — GtkFixed would otherwise paint the panel opaque.
gtk = "0.18"
webkit2gtk = "2.0"

# Test-only, and it must stay that way: nothing in the shipped binary verifies a
# signature itself. `tests/updater_key_pairing.rs` asks whether the public key in
# `tauri.conf.json` is the other half of the release signing key, and it has to
# ask using the plugin's own verifier to mean anything — this is the same crate
# `tauri-plugin-updater` already resolves to. `base64` is here for the same
# reason: the configured key and Tauri's signatures are both base64-wrapped, and
# a hand-rolled decoder beside a cryptographic check is not worth the risk.
[dev-dependencies]
minisign-verify = "0.2"
base64 = "0.22"

[features]
# A directly built desktop binary owns its page. `tauri dev` disables default
# features while it points the webview at Vite, preserving hot reload there.
default = ["custom-protocol"]
# Used for production builds or when a dev server is not specified. Do not remove.
custom-protocol = ["tauri/custom-protocol"]

# Build profiles live in the workspace root Cargo.toml — cargo ignores
# [profile.*] on non-root packages once a workspace is defined.
