<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nessa</title>
    <style>
      [data-nessa-load-fallback] {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        color: #e8e8e8;
        background: #171717;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }

      [data-nessa-load-message] {
        position: fixed;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: 320px;
        height: 320px;
        max-width: 100vw;
        max-height: 100vh;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        padding: 1.5rem;
        overflow-wrap: anywhere;
        text-align: center;
      }

      @keyframes reveal-load-help {
        to {
          opacity: 1;
        }
      }

      [data-nessa-load-help] {
        opacity: 0;
        animation: reveal-load-help 0s 4s forwards;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main data-nessa-load-fallback>
        <div data-nessa-load-message>
          <strong>Loading Nessa…</strong>
          <span data-nessa-load-help>
            If this stays on screen, quit and reopen the app. If it keeps happening,
            reinstall Nessa.
          </span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
