<img data-nessa-startup-mark src="/src-tauri/icons/nessa-avatar.svg" alt="" width="28" height="28" />
<p data-nessa-startup-line>{{LINE}}</p>
<button type="button" data-nessa-startup-code data-nessa-startup-action="copy">{{CODE}}</button>
<div data-nessa-startup-actions>
  <button type="button" aria-label="Restart" data-nessa-startup-action="restart">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
  </button>
  <button type="button" aria-label="Quit" data-nessa-startup-action="quit">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg>
  </button>
</div>
