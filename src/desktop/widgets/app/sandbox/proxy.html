<!doctype html>
<!--
  The sandbox proxy for MCP Apps (MCP Apps 2026-01-26, *Sandbox proxy*).

  Served on an origin of its own, never the window's: by a listener of its
  own in the browser build (`app/sandbox/serve.ts`) and by the
  `nessa-sandbox` scheme in the desktop app (`src-tauri/src/app_sandbox.rs`).
  The window frames it with `sandbox="allow-scripts allow-same-origin"`.

  It decides no policy: the host writes it (`app/model/csp.ts`). It says it is
  ready; it applies the policy the host hands it to its own document, before
  anything else, so its `frame-src` holds the app's frame wherever the app
  navigates it; it loads the one document the host hands it into the app's
  frame, with `sandbox="allow-scripts"` (an opaque origin: the app reaches
  neither this document, nor any other app's, nor storage), which inherits
  the policy and carries it too; and it relays messages between the two. What
  it enforces itself is the relay: only the host (its parent) and the app (its
  frame) are heard; nothing is relayed before the document; methods under
  `ui/notifications/sandbox-` are the host's and this proxy's — none is
  relayed from the host to the app, and of the app's only the CSP reporter's
  is passed on. What its own policy blocks, it reports the same way.
  `verification/desktop/scripts/mcp-apps.mjs --only escape` holds each.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>App sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      ;(function () {
        "use strict"
        // Loaded as a page of its own rather than in a frame — a link to it
        // followed in the window — it is nothing to look at: back to where
        // the window was.
        if (window.parent === window) {
          history.back()
          return
        }
        var host = window.parent
        var reserved = "ui/notifications/sandbox-"
        var reporter = "ui/notifications/sandbox-csp-violation"
        // The host's origin, from its first message; the app's frame, once made.
        var hostOrigin = null
        var app = null
        var left = false

        function methodOf(data) {
          return data !== null &&
            typeof data === "object" &&
            typeof data.method === "string"
            ? data.method
            : null
        }

        window.addEventListener("message", function (event) {
          if (event.source === host) {
            var method = methodOf(event.data)
            if (app === null) {
              // The first thing the host says is the document; nothing is
              // relayed before it.
              if (method !== "ui/notifications/sandbox-resource-ready") return
              var params = event.data.params
              if (params === null || typeof params !== "object") return
              var html = params.html
              var policy = params.policy
              if (typeof html !== "string" || typeof policy !== "string") return
              // The policy first, on this document: what it loads from now
              // on, the app's frame and the frame's every navigation, is held
              // to it.
              var meta = document.createElement("meta")
              meta.setAttribute("http-equiv", "Content-Security-Policy")
              meta.setAttribute("content", policy)
              document.head.appendChild(meta)
              hostOrigin = event.origin
              window.addEventListener("securitypolicyviolation", function (violation) {
                var origin
                try {
                  origin = new URL(violation.blockedURI).origin
                } catch (error) {
                  origin = undefined
                }
                host.postMessage(
                  {
                    jsonrpc: "2.0",
                    method: reporter,
                    params: origin && origin !== "null" ? { origin: origin } : {},
                  },
                  hostOrigin,
                )
              })
              app = document.createElement("iframe")
              app.setAttribute("sandbox", "allow-scripts")
              app.setAttribute("title", "App")
              app.srcdoc = html
              // The frame loads once, the document handed over. A second load
              // is the app gone — its frame navigated, refused or not, or
              // reloaded — and nothing in it is the app's any more: the frame
              // is removed, and the host told.
              var loads = 0
              app.addEventListener("load", function () {
                loads += 1
                if (loads < 2 || left) return
                left = true
                app.remove()
                host.postMessage(
                  {
                    jsonrpc: "2.0",
                    method: "ui/notifications/sandbox-app-left",
                    params: {},
                  },
                  hostOrigin,
                )
              })
              document.body.appendChild(app)
              return
            }
            if (event.origin !== hostOrigin || left) return
            if (method !== null && method.indexOf(reserved) === 0) return
            // The app's origin is opaque: it can be addressed only as "*".
            app.contentWindow.postMessage(event.data, "*")
            return
          }
          if (app !== null && !left && event.source === app.contentWindow) {
            var from = methodOf(event.data)
            if (from !== null && from.indexOf(reserved) === 0 && from !== reporter) return
            host.postMessage(event.data, hostOrigin)
          }
        })

        host.postMessage(
          { jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} },
          "*",
        )
      })()
    </script>
  </body>
</html>
