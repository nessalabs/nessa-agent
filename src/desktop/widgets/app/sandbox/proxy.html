<!doctype html>
<!--
  The sandbox proxy for MCP Apps (MCP Apps 2026-01-26, *Sandbox proxy*).

  Served on an origin of its own, never the window's: by a listener of its
  own in the browser build (`app/sandbox/serve.ts`) and by the
  `nessa-sandbox` scheme in the desktop app (`src-tauri/src/app_sandbox.rs`).
  The window frames it with `sandbox="allow-scripts allow-same-origin"`.

  It decides no policy: the host writes it (`app/model/csp.ts`). It says it is
  ready; it applies the policy the host hands it to its own document, before
  anything else, so its `frame-src` holds the app's frame wherever the app
  navigates it; it loads the one document the host hands it into the app's
  frame, with `sandbox="allow-scripts"` (an opaque origin: the app reaches
  neither this document, nor any other app's, nor storage), which inherits
  the policy and carries it too; and it relays messages between the two. What
  it enforces itself is the relay: only the host (its parent) and the app (its
  frame) are heard; nothing is relayed before the document; methods under
  `ui/notifications/sandbox-` are the host's and this proxy's — none is
  relayed from the host to the app, and of the app's only the CSP reporter's
  is passed on; and the app's departure, after which nothing more is relayed
  and the frame is removed. The departure is the proxy's own reading of the
  frame, where the app cannot reach (design L32): any `load` of the frame
  after its first — a navigation, refused or not, a reload, a rewritten
  document once it is closed — or no first load answered, by the time the
  host gives, with the token this proxy minted for the frame and wrote into
  the reporter alone (an error page or a blank one has none). The
  reporter's word on `pagehide`, carrying the same token (the browser no
  longer names the sender of a document that has gone), says it sooner
  while the app leaves the reporter in place. What its own policy blocks,
  it reports the same way.
  `verification/desktop/scripts/mcp-apps.mjs --only
  escape-navigate,escape-refresh,escape-rewrite,departures,forge` holds each.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>App sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      ;(function () {
        "use strict"
        // Loaded as a page of its own rather than in a frame — a link to it
        // followed in the window — it is nothing to look at: back to where
        // the window was.
        if (window.parent === window) {
          history.back()
          return
        }
        var host = window.parent
        // The names `app/model/sandbox-methods.ts` states; `serve.test.ts`
        // holds this file to each of them.
        var reserved = "ui/notifications/sandbox-"
        var proxyReady = "ui/notifications/sandbox-proxy-ready"
        var resourceReady = "ui/notifications/sandbox-resource-ready"
        var cspViolation = "ui/notifications/sandbox-csp-violation"
        var appLeft = "ui/notifications/sandbox-app-left"
        var appCheck = "ui/notifications/sandbox-app-check"
        var tokenSlot = "__nessa_frame_token__"
        // Minted for this frame, and written into its document's reporter
        // alone: the one way the check's answer is known to come from a
        // document of the app's (not an error page, not a blank one), and a
        // departure notice from this frame once its document is gone and the
        // browser names no sender. No other frame can read it.
        // (`getRandomValues`, not `randomUUID`: a custom scheme's page need
        // not be a secure context.)
        var token = Array.prototype.map
          .call(crypto.getRandomValues(new Uint8Array(16)), function (byte) {
            return (byte + 256).toString(16).slice(1)
          })
          .join("")
        // The host's origin, from its first message; the app's frame, once made.
        var hostOrigin = null
        var app = null
        var left = false
        var loads = 0
        var checking = null

        // The app's document is gone, or going — by the frame's loads, the
        // check, or its reporter's word — and what comes after it in this
        // frame is not the app: nothing more is relayed either way, the host
        // is told, once, and the frame removed on a later turn (removing a
        // frame inside its own load handler takes the renderer down with it).
        function leave() {
          if (left) return
          left = true
          clearTimeout(checking)
          host.postMessage({ jsonrpc: "2.0", method: appLeft, params: {} }, hostOrigin)
          setTimeout(function () {
            app.remove()
          }, 0)
        }

        function methodOf(data) {
          return data !== null &&
            typeof data === "object" &&
            typeof data.method === "string"
            ? data.method
            : null
        }

        window.addEventListener("message", function (event) {
          if (event.source === host) {
            var method = methodOf(event.data)
            if (app === null) {
              // The first thing the host says is the document; nothing is
              // relayed before it.
              if (method !== resourceReady) return
              var params = event.data.params
              if (params === null || typeof params !== "object") return
              var html = params.html
              var policy = params.policy
              var checkWithin = params.checkWithin
              if (
                typeof html !== "string" ||
                typeof policy !== "string" ||
                typeof checkWithin !== "number" ||
                !(checkWithin > 0)
              )
                return
              // The policy first, on this document: what it loads from now
              // on, the app's frame and the frame's every navigation, is held
              // to it.
              var meta = document.createElement("meta")
              meta.setAttribute("http-equiv", "Content-Security-Policy")
              meta.setAttribute("content", policy)
              document.head.appendChild(meta)
              hostOrigin = event.origin
              window.addEventListener("securitypolicyviolation", function (violation) {
                var origin
                try {
                  origin = new URL(violation.blockedURI).origin
                } catch (error) {
                  origin = undefined
                }
                host.postMessage(
                  {
                    jsonrpc: "2.0",
                    method: cspViolation,
                    params: origin && origin !== "null" ? { origin: origin } : {},
                  },
                  hostOrigin,
                )
              })
              app = document.createElement("iframe")
              app.setAttribute("sandbox", "allow-scripts")
              app.setAttribute("title", "App")
              // The reporter's slot comes first in the document, before any
              // of the app's markup: only it is filled.
              app.srcdoc = html.replace(tokenSlot, token)
              // The frame's loads, heard here, where nothing the app runs can
              // remove the listener. By `checkWithin` from now, the frame
              // must have loaded and its reporter, which alone holds the token,
              // answered the check sent at that first load; else the app is
              // gone. Any later load is a new document — a navigation, refused
              // or not, a reload, a closed rewrite — and the app's departure.
              checking = setTimeout(leave, checkWithin)
              app.addEventListener("load", function () {
                if (left) return
                loads += 1
                if (loads > 1) {
                  leave()
                  return
                }
                app.contentWindow.postMessage(
                  { jsonrpc: "2.0", method: appCheck, params: {} },
                  "*",
                )
              })
              document.body.appendChild(app)
              return
            }
            if (event.origin !== hostOrigin || left) return
            if (method !== null && method.indexOf(reserved) === 0) return
            // The app's origin is opaque: it can be addressed only as "*".
            app.contentWindow.postMessage(event.data, "*")
            return
          }
          if (
            app !== null &&
            !left &&
            methodOf(event.data) === appLeft &&
            event.data.params !== null &&
            typeof event.data.params === "object" &&
            event.data.params.token === token
          ) {
            leave()
            return
          }
          if (app !== null && !left && event.source === app.contentWindow) {
            var from = methodOf(event.data)
            if (from === appCheck) {
              if (
                event.data.params !== null &&
                typeof event.data.params === "object" &&
                event.data.params.token === token
              )
                clearTimeout(checking)
              return
            }
            if (from !== null && from.indexOf(reserved) === 0 && from !== cspViolation)
              return
            host.postMessage(event.data, hostOrigin)
          }
        })

        host.postMessage({ jsonrpc: "2.0", method: proxyReady, params: {} }, "*")
      })()
    </script>
  </body>
</html>
