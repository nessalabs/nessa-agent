[package]
name = "nessa-local-storage"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
physical-operation = ["dep:tokio"]

[dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "sync"] }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tempfile = "3"
