[workspace]
resolver = "2"
members = [
  "crates/nessa-vault","crates/nessa-mcp", "crates/nessa-server", "crates/nessa-protocol", "crates/nessa-client-core", "crates/nessa-device-client", "crates/nessa-auth", "crates/nessa-agent-credentials", "crates/nessa-local-storage", "crates/nessa-local-database", "crates/nessa-gateway-endpoint", "crates/nessa-sdk", "crates/nessa-images", "crates/nessa-timer", "crates/nessa-types", "crates/nessa-projection", "crates/nessa-agent-install", "crates/nessa-attachments", "crates/nessa-peer-gateways", "crates/nessa-mcp-authorization", "src-tauri"]

[workspace.dependencies]
nessa-sync = { git = "https://github.com/nessalabs/sync-engine", rev = "f2a05ef24fcff66df9d55e508539cec718e2d805", default-features = false, features = ["transport"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# Rust rules every crate holds. Each member opts in with `[lints] workspace =
# true`, which scripts/workspace-lints.test.mjs checks; clippy runs with
# `-D warnings`, so a `warn` here fails the check. A crate cannot add lints of
# its own beside this table, so a rule for one crate stays an attribute there.
[workspace.lints.clippy]
# Debug output left in after a session of print debugging.
dbg_macro = "warn"
# A stub that compiles and panics the first time it is reached.
todo = "warn"
unimplemented = "warn"
# Off here; nessa-server turns it on outside its tests for the one clock
# (clippy.toml lists the calls), since this table cannot hold a rule for one crate.
disallowed_methods = "allow"
# A future bound to `_` is dropped without running; the work silently never happens.
let_underscore_future = "warn"

# Profiles must live on the workspace root. With a root Cargo.toml, cargo ignores
# [profile.*] in member crates (and warns). Keep release/dev settings here so
# Tauri builds still get fat LTO, one codegen unit, strip, and leaner debug info.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized even in a development build. Our own crates are
# not, so they still build fast and debug honestly; a dependency is code we are
# not stepping through anyway, and it is built once and cached.
#
# This is here because of what image work costs unoptimized. Fitting one Retina
# screenshot — decode, Lanczos3 down to 2,000 px, encode — takes 3.2s of CPU
# with the codecs built as they come, and 0.11s with them optimized. The
# shipped app is a release build and never saw it; `just start` did, on every
# image anybody attached, which is how the feature came to look slow when it
# was the profile.
[profile.dev.package."*"]
opt-level = 2
